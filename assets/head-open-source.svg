<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="120" viewBox="0 0 1280 120" role="img" aria-label="Open source: 6 PUBLIC PROJECTS • OUTER SHELL"><title>Open source: 6 PUBLIC PROJECTS • OUTER SHELL</title><style>
.d{font-family:Unbounded, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-weight:600}
.m{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-weight:500}
